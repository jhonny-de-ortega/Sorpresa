<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Playlist 🎵</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="heartstopper.css">
  <link rel="stylesheet" href="royal.css">
</head>
<body class="page-musica">

  <nav class="top-nav">
    <a href="index.html">← Inicio</a>
    <a href="carta.html">💌 Carta</a>
  </nav>

  <main class="spotify-wrapper">

    <header class="playlist-header">
      <div class="playlist-cover">
        <span class="cover-crown">♛</span>
        <span class="cover-icon">🎧</span>
        <span class="cover-leaves">🍂🍁</span>
      </div>
      <div class="playlist-info">
        <p class="playlist-label">✦ PLAYLIST REAL ✦</p>
        <h1 class="playlist-title">Canciones para ti</h1>
        <p class="playlist-desc">
          Una selección hecha con cariño · ♥ para mi persona favorita
        </p>
        <div class="divider-royal small">
          <span>✦</span><span>❦</span><span>✦</span>
        </div>
      </div>
    </header>

    <ul class="song-list" id="songList"></ul>

  </main>

  <footer class="player-bar" id="playerBar">
    <div class="player-left">
      <div class="now-cover" id="nowCover">🎵</div>
      <div class="now-info">
        <p class="now-title" id="nowTitle">Selecciona una canción</p>
        <p class="now-artist" id="nowArtist">—</p>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="ctrl" id="prevBtn">⏮</button>
        <button class="ctrl play" id="playBtn">▶</button>
        <button class="ctrl" id="nextBtn">⏭</button>
      </div>
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="progressBar" min="0" max="100" value="0">
        <span class="time" id="totalTime">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <span class="vol-icon">🔊</span>
      <input type="range" id="volumeBar" min="0" max="100" value="70">
    </div>

    <audio id="audio"></audio>
  </footer>

  <script src="player.js"></script>
</body>
</html>
